# Model configurations for Dhivehi Translation Arena
#
# Naming convention: {base-model}[-{reasoning}]-t{temp}
# Temperature is always explicit for stability and future-proofing.
#
# Temperature convention:
#   - New models should use 1.0 as the default (recommended) temperature.
#   - Always add a low-temp variant (0.1 or 0.3) alongside the default.
#   - See AGENTS.md for the full model addition workflow.
#
# Required fields per model:
#   name, display_name, type, input_cost_per_mtok, output_cost_per_mtok, is_active
#
# Optional fields:
#   is_hidden, rate_limit, thinking_budget, temperature, reasoning,
#   preset_name, base_model, timeout, deactivation_reason

